<title>Крепче</title>
<style>
/* Layout: phone-first app, fixed bottom nav, one scrolling screen per tab. Reading-room feel: stone paper, graphite ink, jade accent, four track hues. */
:root{
  --bg:#f3f1ea; --bg-2:#ebe8df; --card:#fbfaf6; --line:#d9d4c6;
  --fg:#22261f; --muted:#6c7064; --accent:#2f6f5e; --accent-2:#245648; --on-accent:#f6fbf8;
  --done:#2f6f5e; --done-bg:#e1efe9; --warn:#b8542c;
  --t-self:#b2503f; --t-faith:#2f6f5e; --t-steps:#b07a1f; --t-family:#4b5a9a;
  --display:"New York",Georgia,"Noto Serif","Times New Roman",serif;
  --body:-apple-system,Roboto,"Noto Sans","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161815; --bg-2:#1e211d; --card:#232723; --line:#363b35;
    --fg:#ebe9e0; --muted:#9ea297; --accent:#6fb59f; --accent-2:#8fcdb9; --on-accent:#10211b;
    --done:#6fb59f; --done-bg:#1f332c; --warn:#e08a63;
    --t-self:#e2857a; --t-faith:#6fb59f; --t-steps:#d9a74a; --t-family:#8f9ce0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161815; --bg-2:#1e211d; --card:#232723; --line:#363b35;
  --fg:#ebe9e0; --muted:#9ea297; --accent:#6fb59f; --accent-2:#8fcdb9; --on-accent:#10211b;
  --done:#6fb59f; --done-bg:#1f332c; --warn:#e08a63;
  --t-self:#e2857a; --t-faith:#6fb59f; --t-steps:#d9a74a; --t-family:#8f9ce0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(86px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px;padding-top:14px}
.wrap>*,.card>*,.field>*{min-width:0}
.screen[hidden]{display:none}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:23px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:19px;margin:0;line-height:1.2}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.card.t{border-left:4px solid var(--tc)}
.card .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card .head h2{color:var(--tc,var(--fg))}
.idea{font-family:var(--display);font-size:18px;line-height:1.45}
.book{font-size:12px;color:var(--muted);letter-spacing:.02em}
.book b{color:var(--fg);font-weight:500}
.note{background:var(--bg-2);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
.note b{color:var(--tc,var(--accent));font-weight:600}
.field{display:grid;gap:6px}
.field label{font-size:12px;color:var(--muted);letter-spacing:.02em;display:flex;justify-content:space-between;gap:8px}
.field label span{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
textarea,input[type=text]{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;min-width:0}
textarea{resize:vertical;min-height:60px;line-height:1.4}
.kt{display:grid;gap:6px}
.kt .r{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center}
.kt .r span{color:var(--muted);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.sc{display:grid;gap:8px}
.sc .it{display:grid;gap:4px}
.sc .it input[type=range]{width:100%;accent-color:var(--tc,var(--accent));height:28px}
.sc .it label{font-size:14px;display:flex;justify-content:space-between;gap:8px}
.sc .it label b{font-variant-numeric:tabular-nums;color:var(--tc,var(--accent))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted);background:var(--bg-2)}
.chip[aria-pressed="true"]{background:var(--tc,var(--accent));color:var(--on-accent);border-color:var(--tc,var(--accent))}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2)}
.task .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--tc,var(--accent));display:grid;place-items:center;color:transparent;font-size:15px;font-weight:700;margin-top:1px}
.task[aria-pressed="true"]{background:var(--done-bg);border-color:transparent}
.task[aria-pressed="true"] .bx{background:var(--done);border-color:var(--done);color:var(--on-accent)}
.task span.tx{font-size:15px;line-height:1.4}
.task[aria-pressed="true"] span.tx{color:var(--muted)}
.primary{padding:11px 16px;border-radius:11px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;justify-self:center}
.ghost{padding:9px 14px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:14px}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daybar button{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px}
.daybar .d{text-align:center;display:grid}
.daybar .d b{font-family:var(--display);font-size:22px;font-weight:700}
.daybar .d small{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter .r{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter .r b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid28 button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:grid;place-items:center;background:var(--bg-2)}
.grid28 button.on{background:var(--tc);color:var(--on-accent);border-color:var(--tc)}
.grid28 button.cur{outline:2px solid var(--fg);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:28px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stat small{font-size:11px;color:var(--muted)}
/* mode switch */
.mode{display:flex;gap:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.mode button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.mode button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.welcome{display:grid;gap:14px;text-align:center;padding:24px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.welcome h1{font-size:40px}
.welcome .mode{max-width:320px;margin:0 auto;width:100%}
.tracklist{display:grid;gap:8px}
.tracklist button{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tracklist button i{width:8px;height:40px;border-radius:4px;background:var(--tc)}
.tracklist button b{font-family:var(--display);font-size:19px}
.tracklist button small{color:var(--muted);font-size:12px;display:block}
.tracklist button .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.plist{display:grid;gap:6px}
.plist button{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px}
.plist button b{font-family:var(--display);font-size:18px;color:var(--tc);font-variant-numeric:tabular-nums}
.plist button small{display:block;color:var(--muted);font-size:12px}
.plist button .ok{color:var(--done);font-weight:700}
.back{color:var(--accent);font-weight:600;font-size:14px;justify-self:start}
/* quiz */
.q{display:grid;gap:10px}
.q .qi{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.q .qi:first-child{border-top:0}
.q .qi p{font-size:15px}
.q .opts{display:flex;gap:6px}
.q .opts button{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--bg-2)}
.q .opts button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.res{display:grid;gap:10px;border-left:4px solid var(--accent)}
.res .lab{font-family:var(--display);font-size:24px;color:var(--accent)}
.res .bars{display:grid;gap:6px}
.res .bars .b{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px;align-items:center}
.res .bars .b .bar{grid-column:1/-1}
details{border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card)}
details summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details summary::after{content:"+";color:var(--accent);font-size:18px;flex:none}
details[open] summary::after{content:"–"}
details .in{padding:0 0 14px;display:grid;gap:8px;font-size:14px;line-height:1.5;color:var(--muted)}
details .in b{color:var(--fg)}
.booklist{display:grid;gap:8px}
.bk{display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.bk b{font-family:var(--display);font-size:18px}
.bk .a{font-size:12px;color:var(--muted);letter-spacing:.02em}
.bk p{font-size:14px}
.bk .tl{font-size:13px;color:var(--accent)}
.log{display:grid;gap:6px}
.log .e{display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--bg-2);border-radius:10px;padding:8px 10px;font-size:14px}
.log .e small{display:block;color:var(--muted);font-size:11px}
.log .e .x{color:var(--muted);font-size:16px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:6px}
.addrow button{padding:6px 14px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-weight:600}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{display:flex;gap:2px;padding:0 4px;max-width:560px;margin:0 auto}
nav.bottom button{flex:1;display:grid;justify-items:center;gap:2px;padding:9px 2px 7px;font-size:10px;white-space:nowrap;font-weight:600;color:var(--muted)}
nav.bottom button span{font-size:19px;line-height:1}
nav.bottom button[aria-selected="true"]{color:var(--accent)}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:6px 12px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.status.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="root">
  <section class="screen" id="s-today"></section>
  <section class="screen" id="s-tracks" hidden></section>
  <section class="screen" id="s-quiz" hidden></section>
  <section class="screen" id="s-books" hidden></section>
  <section class="screen" id="s-me" hidden></section>
</main>
<nav class="bottom" id="nav" hidden><div class="in">
  <button type="button" data-tab="today" aria-selected="true"><span>☀︎</span>Сегодня</button>
  <button type="button" data-tab="tracks"><span>◈</span>Практики</button>
  <button type="button" data-tab="quiz"><span>◔</span>Тесты</button>
  <button type="button" data-tab="books"><span>▤</span>Книги</button>
  <button type="button" data-tab="me"><span>✦</span>Путь</button>
</div></nav>
<div class="status" id="status" aria-live="polite"></div>

<script>
/* Содержание тренажёра. Шаблоны пола: {мужской вариант|женский вариант} */
var TRACKS = [
  { id:'self', name:'Любовь к себе', short:'Я', color:'var(--t-self)', intro:'Умение относиться к себе с заботой и уважением. Фромм называл любовь к себе условием любви к другому: кто умеет заботиться о себе, тот умеет заботиться вообще.' },
  { id:'faith', name:'Вера в себя', short:'Опора', color:'var(--t-faith)', intro:'Внутренняя опора: умение принимать решения, выдерживать тревогу и опираться на факты о себе, а не на страхи.' },
  { id:'steps', name:'Маленькие шаги', short:'Шаги', color:'var(--t-steps)', intro:'Готтман сформулировал это как «small things often»: отношения и характер строятся из мелких повторяющихся действий, а не из редких больших жестов.' },
  { id:'family', name:'Крепкая семья', short:'Мы', color:'var(--t-family)', intro:'Навыки пары: понимать циклы близости и дистанции, говорить о потребностях прямо, отвечать на попытки сближения и принимать честные решения.' }
];

var PRACTICES = [

  /* ---------- Маршрут «Когда нет сил» (мужской режим) ---------- */
  { id:'l1', track:'self', mode:'m', title:'Аккумулятор', book:'Д. Дейда · «Путь настоящего мужчины»; А. Курпатов · «Мужчина и женщина»',
    idea:'Ощущение «я камень, мне всё равно» редко означает, что чувства ушли. Чаще это разряженный аккумулятор: мозг экономит энергию и выключает всё, что требует усилий, включая близость. Дейда пишет, что мужчина восстанавливается через тело, дисциплину и своё дело; Курпатов добавляет: истощённый мозг объясняет пустоту «отсутствием любви», потому что так проще, чем признать усталость.',
    ex:{type:'fields', prompt:'Мой баланс энергии за последнюю неделю', fields:['Что меня разряжает (люди, дела, привычки, экран)','Что меня заряжало раньше, когда я был «в строю»','Что из этого я могу сделать уже сегодня хотя бы на 15 минут']},
    step:'Сегодня: 15 минут на одно заряжающее дело из третьего поля, до телефона.',
    q:'Что изменилось в ощущении «всё равно» после этого?' },
  { id:'l6', track:'faith', mode:'m', title:'Из состояния силы', book:'А. Карпавичус · «Расстаться нельзя остаться»',
    idea:'Карпавичус разводит два вопроса, которые в усталости сливаются в один: «мне плохо» и «я не хочу этих отношений». Проверка простая. Представь, что у тебя всё есть: силы, деньги, уверенность, ты ничем не ограничен. Хочешь ли ты в этом состоянии быть с ней? Если ответ «да», расставание продиктовано состоянием, и работать нужно с состоянием. Если «нет», это честный ответ, с которым тоже можно идти дальше.',
    ex:{type:'fields', prompt:'Проверка', fields:['Если бы у меня всё было и я всё мог — хочу ли я быть с ней? (да / нет / не знаю)','Что в отношениях я хочу сохранить','Что именно я хочу изменить, в себе или между нами','Что из этого зависит от моего состояния, а что от самих отношений']},
    step:'Сегодня: записать ответ на первый вопрос одним словом и не перечитывать до вечера.',
    q:'Совпал ли вечерний ответ с утренним?' },
  { id:'l7', track:'family', mode:'m', title:'Разговор глаза в глаза', book:'Д. Готтман · «7 принципов счастливого брака»; С. Джонсон · «Обними меня крепче»',
    idea:'Важные вещи говорят лично, и второй стороне дают высказаться. Готтман называет это «мягким началом»: разговор начинается с «я чувствую» и с конкретной ситуации, без обвинений. Джонсон добавляет главное: под любым трудным разговором лежит вопрос «ты рядом?», и честный ответ на него важнее формулировок. Фраза, сказанная из страха («даю тебе полную свободу»), исправляется прямо: «я сказал это из страха, на самом деле я хочу…».',
    ex:{type:'fields', prompt:'Подготовка разговора', fields:['Что я хочу сказать ей (одной-двумя фразами, с «я чувствую»)','Что я хочу от неё услышать','Что я скажу о фразах, сказанных из страха','Когда и где этот разговор состоится лично']},
    step:'Сегодня: назначить дату и место разговора и записать их.',
    q:'Чего я боюсь в этом разговоре и что случится в худшем случае?' },
  /* ---------- Любовь к себе ---------- */
  { id:'a1', track:'self', title:'Любовь как умение', book:'Э. Фромм · «Искусство любить»',
    idea:'Фромм описывает любовь как умение, которому учатся, подобно музыке или ремеслу. У неё четыре составляющих: забота, ответственность, уважение и знание. Он подчёркивает, что эти же четыре применимы к себе: человек, который умеет заботиться о себе, умеет заботиться вообще.',
    ex:{type:'fields', prompt:'Как это проявляется по отношению ко мне {самому|самой} прямо сейчас?', fields:['Забота: что я делаю для своего тела и сил','Ответственность: за что в своей жизни я отвечаю сам{|а}','Уважение: где я уважаю свои границы и желания','Знание: что я знаю о себе точно']},
    step:'Сегодня: 10 минут чистой заботы о себе (еда, сон, прогулка, тишина).',
    q:'Какая из четырёх составляющих у меня самая слабая и что я сделаю с ней завтра?' },
  { id:'a2', track:'self', title:'Солнечный и теневой ребёнок', book:'С. Шталь · «Ребёнок в тебе может найти любовь»',

      return {label:label, text:text+' Если в ответах есть насилие или зависимость, решение требует помощи специалиста.', bars:[['Основания остаться',k,10],['Основания уйти',g,10]]}; } }
];

<script>
(function(){
  var LS='krepche-v1';
  var st={ mode:'', route:'main', day:1, started:'', done:{}, v:{}, steps:{}, bank:[], log:[], quiz:{} };
  try{ var l=JSON.parse(localStorage.getItem(LS)||'null'); if(l) st=Object.assign(st,l); }catch(e){}
  if(!st.done.main&&!st.done.low){ st.done={main:st.done||{},low:{}}; } if(!st.route) st.route='main'; if(!st.dayLow) st.dayLow=1;
  function prog(){ return st.route==='low'?PROGRAM_LOW:PROGRAM; }
  function R(){ return ROUTES[st.route]; }
  function curDay(){ return st.route==='low'?st.dayLow:st.day; }
  function setDay(n){ if(st.route==='low') st.dayLow=n; else st.day=n; }
  function doneMap(){ return st.done[st.route]; }
  function save(){ try{ localStorage.setItem(LS,JSON.stringify(st)); }catch(e){} }
  var tab='today', view=null, trackView=null, quizView=null;
  try{ tab=sessionStorage.getItem('kr-tab')||'today'; }catch(e){}
  var S={today:el('s-today'),tracks:el('s-tracks'),quiz:el('s-quiz'),books:el('s-books'),me:el('s-me')};
  var statusEl=el('status'), stTimer;
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function G(s){ return String(s).replace(/\{([^{}|]*)\|([^{}]*)\}/g,function(_,m,f){ return st.mode==='m'?m:f; }); }
  function T(s){ return esc(G(s)); }
  function toast(m){ statusEl.textContent=m; statusEl.classList.add('show'); clearTimeout(stTimer); stTimer=setTimeout(function(){statusEl.classList.remove('show');},1500); }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function short(iso){ var d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
  function pr(id){ for(var i=0;i<PRACTICES.length;i++) if(PRACTICES[i].id===id) return PRACTICES[i]; }
  function tr(id){ for(var i=0;i<TRACKS.length;i++) if(TRACKS[i].id===id) return TRACKS[i]; }
  function val(id,def){ var v=st.v[id]; return v==null?def:v; }
  function dayOf(pid){ return prog().indexOf(pid)+1; }

  /* ---------- practice renderer ---------- */
  function renderPractice(p, ctx){
    var t=tr(p.track), h='', ex=p.ex, id=p.id;
    h+='<section class="card t" style="--tc:'+t.color+'"><div class="head"><h2>'+T(p.title)+'</h2><span class="muted">'+esc(t.name)+'</span></div>';
    h+='<div class="book">'+T(p.book)+'</div><p class="idea">'+T(p.idea)+'</p></section>';
    h+='<section class="card" style="--tc:'+t.color+'"><div class="eyebrow" style="color:'+t.color+'">Упражнение</div><p style="font-size:14px">'+T(ex.prompt)+'</p>';
    if(ex.type==='fields'){ ex.fields.forEach(function(f,i){ h+='<div class="field"><label>'+T(f)+'</label><textarea data-v="'+id+'_f'+i+'" placeholder="Напиши здесь">'+esc(val(id+'_f'+i,''))+'</textarea></div>'; }); }
    else if(ex.type==='list'){ h+='<div class="kt">'; for(var i=0;i<ex.count;i++){ h+='<div class="r"><span>'+(i+1)+'</span><input type="text" data-v="'+id+'_l'+i+'" value="'+esc(val(id+'_l'+i,''))+'" placeholder="…"></div>'; } h+='</div>'; if(ex.bank) h+='<button type="button" class="ghost" data-act="bank" data-p="'+id+'" style="justify-self:start">Положить в банк доказательств</button>'; }
    else if(ex.type==='scale'){ h+='<div class="sc">'; ex.items.forEach(function(it,i){ var v=val(id+'_s'+i,5); h+='<div class="it"><label>'+T(it)+'<b>'+v+'</b></label><input type="range" min="0" max="10" value="'+v+'" data-v="'+id+'_s'+i+'"></div>'; }); h+='</div>'; }
    else if(ex.type==='choice'){ var cur=val(id+'_c',''); h+='<div class="chips">'+ex.options.map(function(o){ return '<button type="button" class="chip" data-act="choice" data-p="'+id+'" data-o="'+esc(o)+'" aria-pressed="'+(cur===o)+'">'+esc(o)+'</button>'; }).join('')+'</div><div class="field"><label>'+T(ex.after)+'</label><textarea data-v="'+id+'_f0" placeholder="Напиши здесь">'+esc(val(id+'_f0',''))+'</textarea></div>'; }
    h+='</section>';
    var sd=!!st.steps[id];
    h+='<section class="card" style="--tc:'+t.color+'"><div class="eyebrow" style="color:'+t.color+'">Маленький шаг</div><button type="button" class="task" data-act="step" data-p="'+id+'" aria-pressed="'+sd+'"><span class="bx">✓</span><span class="tx">'+T(p.step)+'</span></button>';
    h+='<div class="field"><label>'+T(p.q)+'</label><textarea data-v="'+id+'_q" placeholder="Ответ вечером">'+esc(val(id+'_q',''))+'</textarea></div>';
    if(ctx==='today'){ var n=dayOf(id), isDone=!!doneMap()[n]; h+='<button type="button" class="primary" data-act="done" data-n="'+n+'">'+(isDone?'День отмечен ✓':'Завершить день '+n)+'</button>'; }
    h+='</section>';
    return h;
  }

  /* ---------- screens ---------- */
  function renderWelcome(){
    return '<section class="welcome"><div class="eyebrow">Личностный тренажёр</div><h1>Крепче</h1><p class="muted" style="font-size:15px;max-width:38ch;margin:0 auto">28 дней практик по 24 книгам об отношениях. Четыре направления: любовь к себе, вера в себя, искусство маленьких шагов, крепкая семья.</p><div class="mode"><button type="button" data-act="mode" data-m="f" aria-selected="false">Женский режим</button><button type="button" data-act="mode" data-m="m" aria-selected="false">Мужской режим</button></div><p class="muted">Режим меняет обращение и часть практик. В мужском режиме есть короткий маршрут «Когда нет сил» на 7 дней. Переключить режим можно на вкладке «Путь».</p></section>';
  }
  function renderToday(){
    if(!st.mode){ S.today.innerHTML=renderWelcome(); return; }
    if(st.mode!=='m'&&st.route==='low'){ st.route='main'; save(); }
    var P=prog(), N=R().days, n=Math.min(N,view==null?curDay():view), pid=P[n-1], p=pr(pid), t=tr(p.track), dm=doneMap(), doneN=Object.keys(dm).length, h='';
    h+='<header><div class="eyebrow">Крепче · '+(st.mode==='m'?'мужской режим':'женский режим')+'</div><h1>День '+n+'</h1><div class="muted">'+esc(t.name)+' · '+(n===curDay()?'текущий день':'просмотр')+(st.started?' · начало '+esc(short(st.started)):'')+'</div></header>';
    if(st.mode==='m') h+='<div class="mode"><button type="button" data-act="route" data-r="main" aria-selected="'+(st.route==='main')+'">Основной · 28</button><button type="button" data-act="route" data-r="low" aria-selected="'+(st.route==='low')+'">Когда нет сил · 7</button></div>'+(st.route==='low'?'<p class="muted">'+esc(ROUTES.low.intro)+'. После семи дней можно перейти на основной маршрут.</p>':'');
    h+='<div class="daybar"><button type="button" data-act="prev"'+(n<=1?' disabled style="opacity:.3"':'')+'>‹</button><div class="d"><b>'+doneN+' / '+N+'</b><small>дней пройдено</small></div><button type="button" data-act="next"'+(n>=N?' disabled style="opacity:.3"':'')+'>›</button></div>';
    h+='<div class="bar"><i style="width:'+(doneN/N*100).toFixed(0)+'%"></i></div>';
    h+=renderPractice(p,'today');
    if(n!==curDay()) h+='<button type="button" class="ghost" data-act="goto" data-n="'+n+'" style="justify-self:center">Сделать этот день текущим</button>';
    if(st.route==='low'&&doneN>=7) h+='<section class="card res"><div class="eyebrow">Маршрут пройден</div><p style="font-size:14px">Семь дней восстановления позади. Следующий шаг — основной маршрут на 28 дней: он укрепит то, что уже появилось.</p><button type="button" class="primary" data-act="route" data-r="main">Перейти на основной</button></section>';
    h+='<details><summary>Все дни маршрута</summary><div class="in"><div class="grid28">'+P.map(function(id,i){ var tt=tr(pr(id).track); return '<button type="button" data-act="view" data-n="'+(i+1)+'" class="'+(dm[i+1]?'on':'')+(i+1===curDay()?' cur':'')+'" style="--tc:'+tt.color+'" title="'+esc(pr(id).title)+'">'+(i+1)+'</button>'; }).join('')+'</div><div class="muted">'+TRACKS.map(function(x){return '<span style="color:'+x.color+'">●</span> '+esc(x.name);}).join(' &nbsp; ')+'</div></div></details>';
    S.today.innerHTML=h;
  }
  function renderTracks(){
    var h='';
    if(view&&pr(view)){ var p=pr(view); h+='<button type="button" class="back" data-act="back-track">‹ '+esc(tr(p.track).name)+'</button>'+renderPractice(p,'browse'); S.tracks.innerHTML=h; return; }
    if(trackView){ var t=tr(trackView); h+='<button type="button" class="back" data-act="back-tracks">‹ Все направления</button><header><h1 style="color:'+t.color+'">'+esc(t.name)+'</h1><p class="muted" style="font-size:14px">'+esc(t.intro)+'</p></header><div class="plist">';
      PRACTICES.filter(function(x){return x.track===trackView&&(!x.mode||x.mode===st.mode);}).forEach(function(p,i){ h+='<button type="button" data-act="open" data-p="'+p.id+'" style="--tc:'+t.color+'"><b>'+(i+1)+'</b><span>'+T(p.title)+'<small>'+T(p.book)+'</small></span><span class="ok">'+(st.steps[p.id]?'✓':'')+'</span></button>'; });
      h+='</div>'; S.tracks.innerHTML=h; return; }
    h+='<header><div class="eyebrow">Четыре направления</div><h1>Практики</h1><p class="muted">По семь практик в каждом. Можно идти по программе на вкладке «Сегодня» или выбирать свободно.</p></header><div class="tracklist">';
    TRACKS.forEach(function(t){ var ps=PRACTICES.filter(function(x){return x.track===t.id&&(!x.mode||x.mode===st.mode);}), d=ps.filter(function(x){return st.steps[x.id];}).length; h+='<button type="button" data-act="track" data-t="'+t.id+'" style="--tc:'+t.color+'"><i></i><span><b>'+esc(t.name)+'</b><small>'+esc(t.intro.split('.')[0])+'.</small></span><span class="n">'+d+'/'+ps.length+'</span></button>'; });
    h+='</div>'; S.tracks.innerHTML=h;
  }
  function renderQuiz(){
    var h='', list=QUIZZES.filter(function(q){return q.mode==='both'||q.mode===st.mode;});
    if(quizView){ var q=null; list.forEach(function(x){ if(x.id===quizView) q=x; }); if(!q){ quizView=null; return renderQuiz(); }
      var a=st.quiz[q.id]||{}; h+='<button type="button" class="back" data-act="back-quiz">‹ Все тесты</button><header><h1>'+esc(q.title)+'</h1><div class="book">'+esc(q.book)+'</div><p class="muted" style="font-size:14px">'+esc(q.intro)+'</p></header>';
      h+='<section class="card q">'+q.items.map(function(it,i){ return '<div class="qi"><p>'+T(it.t)+'</p><div class="opts">'+q.scale.map(function(s,k){ return '<button type="button" data-act="ans" data-q="'+q.id+'" data-i="'+i+'" data-k="'+k+'" aria-pressed="'+(a[i]===k)+'">'+esc(s)+'</button>'; }).join('')+'</div></div>'; }).join('')+'</section>';
      var answered=Object.keys(a).length;
      if(answered===q.items.length){ var sc={}; q.items.forEach(function(it,i){ sc[it.k]=(sc[it.k]||0)+a[i]; }); q.items.forEach(function(it){ if(sc[it.k]==null) sc[it.k]=0; }); var r=q.result(sc);
        h+='<section class="card res"><div class="eyebrow">Результат</div><div class="lab">'+T(r.label)+'</div><p style="font-size:14px">'+T(r.text)+'</p><div class="bars">'+r.bars.map(function(b){ return '<div class="b"><span>'+esc(b[0])+'</span><span class="muted">'+b[1]+' / '+b[2]+'</span><div class="bar"><i style="width:'+(b[1]/b[2]*100).toFixed(0)+'%"></i></div></div>'; }).join('')+'</div><button type="button" class="ghost" data-act="requiz" data-q="'+q.id+'" style="justify-self:start">Пройти заново</button></section>'; }
      else h+='<p class="muted" style="text-align:center">Отвечено '+answered+' из '+q.items.length+'</p>';
      S.quiz.innerHTML=h; return; }
    h+='<header><div class="eyebrow">Диагностика</div><h1>Тесты</h1><p class="muted">Короткие опросники из книг. Результат показывает, с какого направления начать.</p></header><div class="plist">';
    list.forEach(function(q){ var a=st.quiz[q.id]||{}, full=Object.keys(a).length===q.items.length; h+='<button type="button" data-act="quiz" data-q="'+q.id+'" style="--tc:var(--accent)"><b>'+(full?'✓':'?')+'</b><span>'+esc(q.title)+'<small>'+esc(q.book)+'</small></span><span class="muted">'+q.items.length+' в.</span></button>'; });
    h+='</div>'; S.quiz.innerHTML=h;
  }
  function renderBooks(){
    var h='<header><div class="eyebrow">Библиотека</div><h1>Книги</h1><p class="muted">Главная мысль и рабочий инструмент из каждой книги.</p></header><div class="booklist">';
    BOOKS.forEach(function(b){ h+='<div class="bk"><div class="a">'+esc(b.a)+'</div><b>«'+esc(b.t)+'»</b><p>'+esc(b.idea)+'</p><div class="tl">Инструмент: '+esc(b.tool)+'</div></div>'; });
    S.books.innerHTML=h+'</div>';
  }
  function renderMe(){
    var doneN=Object.keys(st.done.main).length+Object.keys(st.done.low).length, stepsN=Object.keys(st.steps).filter(function(k){return st.steps[k];}).length, h='';
    h+='<header><div class="eyebrow">Мой путь</div><h1>Путь</h1></header>';
    h+='<div class="stats"><div class="stat"><b>'+doneN+'</b><small>дней пройдено</small></div><div class="stat"><b>'+stepsN+'</b><small>маленьких шагов</small></div><div class="stat"><b>'+st.bank.length+'</b><small>в банке доказательств</small></div></div>';
    h+='<section class="card"><div class="eyebrow">Банк доказательств</div><p class="muted">Факты, что я справляюсь. Перечитывать в трудный день.</p><div class="log">'+st.bank.slice().reverse().map(function(e,i){ var idx=st.bank.length-1-i; return '<div class="e"><span>'+esc(e.t)+'<small>'+esc(short(e.d))+'</small></span><button type="button" class="x" data-act="bank-del" data-i="'+idx+'">×</button></div>'; }).join('')+'</div><div class="addrow"><input type="text" id="bank-new" placeholder="Сегодня я справил'+(st.mode==='m'?'ся':'ась')+' с…"><button type="button" data-act="bank-add">+</button></div></section>';
    h+='<section class="card"><div class="eyebrow">Журнал шагов</div><p class="muted">Любое реальное действие: разговор, «нет», час на своё дело.</p><div class="log">'+st.log.slice().reverse().map(function(e,i){ var idx=st.log.length-1-i; return '<div class="e"><span>'+esc(e.t)+'<small>'+esc(short(e.d))+'</small></span><button type="button" class="x" data-act="log-del" data-i="'+idx+'">×</button></div>'; }).join('')+'</div><div class="addrow"><input type="text" id="log-new" placeholder="Что я сделал'+(st.mode==='m'?'':'а')+' сегодня"><button type="button" data-act="log-add">+</button></div></section>';
    h+='<section class="card"><div class="eyebrow">Режим</div><div class="mode"><button type="button" data-act="mode" data-m="f" aria-selected="'+(st.mode==='f')+'">Женский</button><button type="button" data-act="mode" data-m="m" aria-selected="'+(st.mode==='m')+'">Мужской</button></div><p class="muted">Приложение работает без интернета. Записи хранятся на этом устройстве; для переноса используй блок ниже.</p><button type="button" class="ghost" data-act="reset" style="justify-self:start;font-size:12px">Сбросить программу (записи останутся)</button></section>';
    h+='<section class="card"><div class="eyebrow">Перенос на другое устройство</div><p class="muted">Скопируй код здесь, вставь его в такое же поле на другом телефоне и нажми «Загрузить». Загрузка заменит записи на том устройстве.</p><div class="addrow"><button type="button" class="ghost" data-act="export" style="justify-self:start">Скопировать мои записи</button></div><textarea id="import-box" placeholder="Вставь код записей сюда" style="min-height:56px;font-size:12px"></textarea><div class="addrow"><span></span><button type="button" data-act="import">Загрузить</button></div></section>';
    S.me.innerHTML=h;
  }
  function render(){ el('nav').hidden=!st.mode; Object.keys(S).forEach(function(k){ S[k].hidden=(k!==tab); }); document.querySelectorAll('nav.bottom button').forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-tab')===tab); });
    if(tab==='today') renderToday(); else if(tab==='tracks') renderTracks(); else if(tab==='quiz') renderQuiz(); else if(tab==='books') renderBooks(); else renderMe(); }

  /* ---------- events ---------- */
  el('nav').addEventListener('click',function(e){ var b=e.target.closest('[data-tab]'); if(!b) return; tab=b.getAttribute('data-tab'); view=null; try{sessionStorage.setItem('kr-tab',tab);}catch(x){} render(); window.scrollTo(0,0); });
  var root=el('root');
  root.addEventListener('input',function(e){ var k=e.target.getAttribute('data-v'); if(!k) return; st.v[k]=e.target.type==='range'?Number(e.target.value):e.target.value; if(e.target.type==='range'){ var b=e.target.previousElementSibling.querySelector('b'); if(b) b.textContent=e.target.value; } save(); });
  root.addEventListener('keydown',function(e){ if(e.key==='Enter'&&(e.target.id==='bank-new'||e.target.id==='log-new')){ e.preventDefault(); e.target.parentNode.querySelector('button').click(); } });
  root.addEventListener('click',function(e){ var b=e.target.closest('[data-act]'); if(!b) return; var act=b.getAttribute('data-act');
    if(act==='mode'){ st.mode=b.getAttribute('data-m'); if(!st.started) st.started=today(); if(st.mode!=='m') st.route='main'; save(); render(); toast(st.mode==='m'?'Мужской режим':'Женский режим'); }
    else if(act==='route'){ st.route=b.getAttribute('data-r'); view=null; save(); tab='today'; render(); window.scrollTo(0,0); toast('Маршрут: '+ROUTES[st.route].name); }
    else if(act==='export'){ var txt=JSON.stringify(st); var ok=function(){ toast('Скопировано ✦'); }; var fb=function(){ var ib=el('import-box'); if(ib){ ib.value=txt; ib.focus(); ib.select(); } toast('Выдели и скопируй текст в поле'); }; if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok,fb); } else fb(); }
    else if(act==='import'){ var ib2=el('import-box'); try{ var d=JSON.parse(ib2.value); if(!d||typeof d!=='object'||!d.v) throw 0; st=Object.assign({mode:'',route:'main',day:1,dayLow:1,started:'',done:{main:{},low:{}},v:{},steps:{},bank:[],log:[],quiz:{}},d); if(!st.done.main) st.done={main:st.done||{},low:{}}; save(); render(); toast('Записи загружены ✦'); }catch(e){ toast('Код не распознан'); } }
    else if(act==='prev'){ view=Math.max(1,(view==null?curDay():view)-1); renderToday(); window.scrollTo(0,0); }
    else if(act==='next'){ view=Math.min(R().days,(view==null?curDay():view)+1); renderToday(); window.scrollTo(0,0); }
    else if(act==='view'){ view=Number(b.getAttribute('data-n')); renderToday(); window.scrollTo(0,0); }
    else if(act==='goto'){ setDay(Number(b.getAttribute('data-n'))); view=null; save(); renderToday(); }
    else if(act==='done'){ var n=Number(b.getAttribute('data-n')), dm2=doneMap(); if(dm2[n]){ delete dm2[n]; } else { dm2[n]=today(); if(n===curDay()&&curDay()<R().days) setDay(curDay()+1); view=null; toast('День '+n+' пройден ✦'); } save(); renderToday(); window.scrollTo(0,0); }
    else if(act==='step'){ var p=b.getAttribute('data-p'); st.steps[p]=!st.steps[p]; b.setAttribute('aria-pressed',st.steps[p]); if(st.steps[p]){ var pp=pr(p); st.log.push({d:today(),t:G(pp.step).replace(/^Сегодня: /,'').replace(/\.$/,'')}); toast('Шаг сделан ✦'); } save(); }
    else if(act==='choice'){ var p2=b.getAttribute('data-p'); st.v[p2+'_c']=b.getAttribute('data-o'); save(); b.parentNode.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed',c===b); }); }
    else if(act==='bank'){ var p3=b.getAttribute('data-p'), c=0; for(var i=0;i<3;i++){ var v=(st.v[p3+'_l'+i]||'').trim(); if(v){ st.bank.push({d:today(),t:v}); c++; } } save(); toast(c?'Добавлено: '+c:'Сначала заполни строки'); }
    else if(act==='track'){ trackView=b.getAttribute('data-t'); view=null; renderTracks(); window.scrollTo(0,0); }
    else if(act==='open'){ view=b.getAttribute('data-p'); renderTracks(); window.scrollTo(0,0); }
    else if(act==='back-track'){ view=null; renderTracks(); window.scrollTo(0,0); }
    else if(act==='back-tracks'){ trackView=null; view=null; renderTracks(); window.scrollTo(0,0); }
    else if(act==='quiz'){ quizView=b.getAttribute('data-q'); renderQuiz(); window.scrollTo(0,0); }
    else if(act==='back-quiz'){ quizView=null; renderQuiz(); window.scrollTo(0,0); }
    else if(act==='ans'){ var q=b.getAttribute('data-q'); st.quiz[q]=st.quiz[q]||{}; st.quiz[q][b.getAttribute('data-i')]=Number(b.getAttribute('data-k')); save(); var y=window.scrollY; renderQuiz(); window.scrollTo(0,y); }
    else if(act==='requiz'){ delete st.quiz[b.getAttribute('data-q')]; save(); renderQuiz(); window.scrollTo(0,0); }
    else if(act==='bank-add'){ var inp=el('bank-new'), v2=inp.value.trim(); if(!v2) return; st.bank.push({d:today(),t:v2}); save(); renderMe(); el('bank-new').focus(); }
    else if(act==='bank-del'){ st.bank.splice(Number(b.getAttribute('data-i')),1); save(); renderMe(); }
    else if(act==='log-add'){ var inp2=el('log-new'), v3=inp2.value.trim(); if(!v3) return; st.log.push({d:today(),t:v3}); save(); renderMe(); el('log-new').focus(); }
    else if(act==='log-del'){ st.log.splice(Number(b.getAttribute('data-i')),1); save(); renderMe(); }
    else if(act==='reset'){ if(b.getAttribute('data-sure')!=='1'){ b.setAttribute('data-sure','1'); b.textContent='Точно сбросить? Нажми ещё раз'; return; } st.day=1; st.dayLow=1; st.done={main:{},low:{}}; st.steps={}; st.started=today(); save(); renderMe(); toast('Программа начата заново'); }
  });
  render();
})();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
